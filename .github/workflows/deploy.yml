name: Deploy to Contabo VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # Cargar NVM y Node.js para que estén disponibles en este shell no interactivo
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            cd /var/www/nuamana
            # Descargar y forzar la sincronización exacta con origin/main
            git fetch origin main
            git reset --hard origin/main
            
            # Asegurar la existencia de la tabla de control de migraciones
            echo "Inicializando tabla de control de migraciones..."
            docker exec -i supabase-db psql -U postgres -d postgres -c "CREATE TABLE IF NOT EXISTS public.applied_migrations (filename text PRIMARY KEY, applied_at timestamp default now());"

            # Desactivar temporalmente el trigger de notificaciones si existe para evitar spam en migraciones
            echo "Desactivando trigger de notificaciones..."
            docker exec -i supabase-db psql -U postgres -d postgres -c "ALTER TABLE public.articulos DISABLE TRIGGER trigger_notificar_cambio_articulo;" || true
            
            # Aplicar sólo las migraciones no ejecutadas anteriormente en orden cronológico
            echo "Ejecutando migraciones de base de datos..."
            for f in supabase/migrations/*.sql; do
              filename=$(basename "$f")
              # Comprobar si la migración ya fue aplicada
              count=$(docker exec -i supabase-db psql -U postgres -d postgres -t -q -A -c "SELECT count(*) FROM public.applied_migrations WHERE filename = '$filename';" | tr -d '[:space:]')
              if [ "$count" != "0" ]; then
                echo "Migración ya aplicada, omitiendo: $filename"
              else
                echo "Aplicando migración: $filename"
                cat "$f" | docker exec -i -e PGCLIENTENCODING=UTF8 supabase-db psql -U postgres -d postgres -v ON_ERROR_STOP=1
                if [ $? -eq 0 ]; then
                  docker exec -i supabase-db psql -U postgres -d postgres -c "INSERT INTO public.applied_migrations (filename) VALUES ('$filename');"
                else
                  echo "ERROR crítico al aplicar migración: $filename"
                  exit 1
                fi
              fi
            done

            # Reactivar el trigger de notificaciones al finalizar si existe
            echo "Reactivando trigger de notificaciones..."
            docker exec -i supabase-db psql -U postgres -d postgres -c "ALTER TABLE public.articulos ENABLE TRIGGER trigger_notificar_cambio_articulo;" || true

            # Entrar al frontend e instalar y compilar limpiando la caché de Next.js
            cd frontend
            npm install
            rm -rf .next
            npm run build
            
            # Sincronizar imágenes a la carpeta de uploads servida por Nginx
            mkdir -p /var/www/nuamana/public/uploads
            mkdir -p /var/www/nuamana/frontend/public/uploads
            cp -r /var/www/nuamana/frontend/public/uploads/* /var/www/nuamana/public/uploads/ 2>/dev/null || true
            chmod -R 755 /var/www/nuamana/public/uploads
            chmod -R 755 /var/www/nuamana/frontend/public/uploads

            # Reiniciar la aplicación de Next.js en PM2
            pm2 reload nuamana-pwa --update-env || pm2 restart nuamana-pwa